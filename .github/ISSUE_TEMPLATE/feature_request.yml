name: Feature request
description: Propose a change or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like ATLAS to do, and how it would behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, including doing nothing, and why you set them aside.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Mockups, links, or the data this would depend on.
    validations:
      required: false
